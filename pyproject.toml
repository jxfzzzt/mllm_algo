[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mllm_algo"
version = "0.1.0"
description = "Readable PyTorch implementations of CLIP, BLIP, BLIP-2, Flamingo and LLaVA"
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["mllm_algo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
